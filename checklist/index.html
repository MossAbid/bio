<link rel="canonical" href="https://consultantchronicles.fr/Checklist-du-Recruteur.pdf">
<script>
  // Compte le téléchargement dans GoatCounter, puis ouvre le PDF (au plus tard après 800 ms).
  (function () {
    var go = function () { location.replace('/Checklist-du-Recruteur.pdf'); };
    var img = new Image();
    img.onload = img.onerror = go;
    img.src = 'https://consultantchronicles.goatcounter.com/count?p=' + encodeURIComponent('/checklist')
      + '&t=' + encodeURIComponent('Checklist (téléchargement direct)')
      + '&r=' + encodeURIComponent(document.referrer) + '&rnd=' + Math.random().toString(36).slice(2);
    setTimeout(go, 800);
  })();
</script>
